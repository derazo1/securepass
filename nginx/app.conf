root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# add_header dentro de un location reemplaza los del server, por eso cada bloque incluye el snippet.
include /etc/nginx/securepass/security-headers.conf;

location = /index.html {
    include /etc/nginx/securepass/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location /assets/ {
    include /etc/nginx/securepass/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
