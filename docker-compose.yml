services:
  securepass:
    build: .
    image: securepass:latest
    container_name: securepass
    restart: unless-stopped
    environment:
      SECUREPASS_TLS: ${SECUREPASS_TLS:-auto}
      SECUREPASS_HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      # Lectura de la clave privada aunque pertenezca a otro usuario del anfitrión (permisos 600).
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true

  # Opcional: emite y renueva certificados de Let's Encrypt. Se activa con --profile letsencrypt.
  acme:
    image: neilpang/acme.sh:3.1.1
    container_name: securepass-acme
    profiles: ["letsencrypt"]
    restart: unless-stopped
    command: daemon
    env_file:
      - path: .env
        required: false
    volumes:
      - ./acme:/acme.sh
      - ./certs:/certs
    security_opt:
      - no-new-privileges:true
